<div class="pw-wrap" [class.is-invalid]="isInvalid()">
  <input class="form-control pw-input" [type]="visible() ? 'text' : 'password'" [value]="value" [disabled]="disabled()"
    [placeholder]="placeholder()" [attr.autocomplete]="autocomplete()" [attr.aria-invalid]="isInvalid() || null"
    (input)="onInput($event)" (blur)="onBlur()" />

  <button type="button" class="pw-toggle" [attr.aria-label]="visible() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
    [attr.aria-pressed]="visible()" [disabled]="disabled()" (click)="toggle()" tabindex="-1">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (visible()) {
      <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.8M6.6 6.6A17.3 17.3 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" />
      } @else {
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
      <circle cx="12" cy="12" r="3" />
      }
    </svg>
  </button>
</div>
