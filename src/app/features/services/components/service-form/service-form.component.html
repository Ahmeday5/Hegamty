<app-modal [open]="open()" [title]="title()" size="md" (closed)="closed.emit()">
  <form id="service-form" class="form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label class="form-label" for="sf-country">الدولة</label>
      <select id="sf-country" class="form-select" formControlName="countryId" [class.is-invalid]="invalid('countryId')">
        @for (c of countries(); track c.id) { <option [value]="c.id">{{ c.name }}</option> }
      </select>
      <app-form-error [control]="form.controls.countryId" label="الدولة" />
    </div>

    <div>
      <label class="form-label" for="sf-cat">التصنيف</label>
      <select id="sf-cat" class="form-select" formControlName="categoryId" [class.is-invalid]="invalid('categoryId')">
        <option value="" disabled>اختر التصنيف</option>
        @for (c of categories(); track c.id) { <option [value]="c.id">{{ c.name }}{{ c.active ? '' : ' (موقوف)' }}</option> }
      </select>
      <app-form-error [control]="form.controls.categoryId" label="التصنيف" />
    </div>

    <div class="span-2">
      <label class="form-label" for="sf-name">اسم الخدمة</label>
      <input id="sf-name" class="form-control" formControlName="name" placeholder="مثال: حجامة رطبة" [class.is-invalid]="invalid('name')" />
      <app-form-error [control]="form.controls.name" label="اسم الخدمة" />
    </div>

    <div class="span-2">
      <label class="form-label" for="sf-price">السعر ({{ currency() }})</label>
      <input id="sf-price" type="number" min="1" class="form-control" formControlName="price" [class.is-invalid]="invalid('price')" />
      <app-form-error [control]="form.controls.price" label="السعر" />
    </div>

    <div class="span-2 sf-toggle">
      <div>
        <strong>للخدمة مدة محددة</strong>
        <span>أوقفها للخدمات التي ليس لها وقت ثابت</span>
      </div>
      <button type="button" class="switch" role="switch" [class.is-on]="form.controls.hasDuration.value"
        [attr.aria-checked]="form.controls.hasDuration.value" aria-label="مدة محددة" (click)="toggle('hasDuration')"></button>
    </div>

    @if (form.controls.hasDuration.value) {
      <div class="span-2">
        <label class="form-label" for="sf-duration">المدة (دقيقة)</label>
        <input id="sf-duration" type="number" min="5" class="form-control" formControlName="durationMin" [class.is-invalid]="invalid('durationMin')" />
        <app-form-error [control]="form.controls.durationMin" label="المدة" />
      </div>
    }

    <div class="span-2">
      <label class="form-label" for="sf-desc">وصف الخدمة</label>
      <textarea id="sf-desc" class="form-control" rows="3" formControlName="description" maxlength="200"
        placeholder="وصف مختصر يظهر للعملاء في التطبيق…" [class.is-invalid]="invalid('description')"></textarea>
      <app-form-error [control]="form.controls.description" label="الوصف" />
    </div>

    <div class="span-2 sf-toggle">
      <div>
        <strong>الخدمة مفعّلة</strong>
        <span>الخدمات الموقوفة لا تظهر للعملاء ولا يمكن حجزها</span>
      </div>
      <button type="button" class="switch" role="switch" [class.is-on]="form.controls.active.value"
        [attr.aria-checked]="form.controls.active.value" aria-label="تفعيل الخدمة" (click)="toggle('active')"></button>
    </div>
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn btn-ghost" (click)="closed.emit()">إلغاء</button>
    <button type="submit" form="service-form" class="btn btn-pr" [disabled]="saving()">
      @if (saving()) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> جارٍ الحفظ… }
      @else { {{ service() ? 'حفظ التغييرات' : 'إضافة الخدمة' }} }
    </button>
  </ng-container>
</app-modal>
