<app-modal [open]="open()" [title]="title()" size="md" (closed)="closed.emit()">
  <form id="country-form" class="form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="span-2">
      <label class="form-label" for="cf-name">اسم الدولة</label>
      <input id="cf-name" class="form-control" formControlName="name" placeholder="مثال: سلطنة عُمان" [class.is-invalid]="invalid('name')" />
      <app-form-error [control]="form.controls.name" label="اسم الدولة" />
    </div>

    <div>
      <label class="form-label" for="cf-cur">العملة</label>
      <input id="cf-cur" class="form-control" formControlName="currency" placeholder="مثال: ريال" [class.is-invalid]="invalid('currency')" />
      <app-form-error [control]="form.controls.currency" label="العملة" />
    </div>

    <div>
      <label class="form-label" for="cf-dial">كود الدولة</label>
      <input id="cf-dial" class="form-control" formControlName="dialCode" dir="ltr" placeholder="+968"
        [class.is-invalid]="invalid('dialCode')" />
      <app-form-error [control]="form.controls.dialCode" label="كود الدولة" />
    </div>

    <div class="span-2">
      <label class="form-label" for="cf-city">المدن</label>
      <div class="cf-tags" [class.is-invalid]="citiesTouched() && !cities().length">
        @for (c of cities(); track c) {
          <span class="cf-tag">{{ c }} <button type="button" [attr.aria-label]="'حذف ' + c" (click)="removeCity(c)"><app-icon name="x" [size]="12" [stroke]="2.4" /></button></span>
        }
        <input id="cf-city" [value]="cityDraft()" (input)="cityDraft.set($any($event.target).value)"
          (keydown.enter)="addCity($event)" (blur)="addCity()" placeholder="اكتب اسم المدينة واضغط Enter" />
      </div>
      @if (citiesTouched() && !cities().length) {
        <div class="cf-err">أضف مدينة واحدة على الأقل</div>
      } @else {
        <small class="cf-hint">يمكنك لصق عدة مدن مفصولة بفاصلة</small>
      }
    </div>
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn btn-ghost" (click)="closed.emit()">إلغاء</button>
    <button type="submit" form="country-form" class="btn btn-pr" [disabled]="saving()">
      @if (saving()) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> جارٍ الحفظ… }
      @else { {{ country() ? 'حفظ التغييرات' : 'إضافة الدولة' }} }
    </button>
  </ng-container>
</app-modal>
