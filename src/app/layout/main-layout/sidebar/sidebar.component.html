<aside class="sidebar" [class.collapsed]="layout.collapsed()" [class.open]="layout.mobileOpen()"
  aria-label="القائمة الرئيسية">
  <div class="sb-bg" aria-hidden="true">
    <span class="sb-orb sb-orb--1"></span>
    <span class="sb-orb sb-orb--2"></span>
    <svg class="sb-waves" viewBox="0 0 260 160" preserveAspectRatio="none">
      <path d="M0 110 C 60 60, 120 150, 180 100 S 240 60, 260 80" />
      <path d="M0 135 C 70 90, 130 170, 190 125 S 245 95, 260 110" />
    </svg>
  </div>

  <a class="sb-brand" routerLink="/dashboard" (click)="layout.closeMobile()" aria-label="HiCan — لوحة التحكم">
    <img class="sb-logo" src="assets/img/logo.jpg" alt="HiCan" width="256" height="256" />
  </a>

  <nav class="sb-nav">
    @for (section of visibleSections(); track section.label; let s = $index) {
      <div class="sb-sec">{{ section.label }}</div>
      @for (item of section.items; track item.id; let i = $index) {
        <a class="sbi" [routerLink]="item.route" routerLinkActive="on" [attr.title]="layout.collapsed() ? item.label : null"
          [style.--d]="s * 3 + i" (click)="layout.closeMobile()">
          <span class="sbi-icon"><app-icon [name]="iconName(item)" [size]="18" /></span>
          <span class="sbi-label">{{ item.label }}</span>
          <app-icon class="sbi-arrow" name="chevron-left" [size]="16" />
        </a>
      }
    }
  </nav>

  <!--<div class="sb-help">
    <span class="sb-help__icon"><app-icon name="sparkles" [size]="20" /></span>
    <strong>تحتاج مساعدة؟</strong>
    <p>فريق الدعم الفني متاح على مدار الساعة لمساعدتك.</p>
    <a class="sb-help__btn" href="mailto:support@hican.com">
      <app-icon name="message" [size]="16" /> تواصل مع الدعم
    </a>
  </div>-->

  <div class="sb-ver">HiCan · v{{ version }}</div>
</aside>
