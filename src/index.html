<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#20843D" />
  <meta name="color-scheme" content="light dark" />
  <title>Hegamty</title>
  <base href="/" />
  <link rel="icon" type="image/png" href="assets/img/logoo.png" />
  <link rel="preload" as="image" href="assets/img/logo.png" />
  <meta name="description" content="Hegamty — لوحة تحكم إدارة عيادات الحجامة" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Critical inline CSS — paints the shell instantly */
    :root { --bg:#f7f9f8; --txt:#000000; --bl:#20843D; --brd:rgba(0,0,0,.1); }
    *,*::before,*::after { box-sizing: border-box; }
    html,body { margin:0; padding:0; }
    html { font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-size: 13px;
      min-height: 100dvh;
      overflow: hidden;
    }
    .app-boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      gap: 14px;
      background: var(--bg);
    }
    .app-boot__spin {
      width: 28px; height: 28px;
      border: 2px solid var(--brd);
      border-top-color: var(--bl);
      border-radius: 50%;
      animation: app-boot-spin .8s linear infinite;
    }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    app-root:not(:empty) ~ .app-boot,
    app-root:has(*) + .app-boot { display: none; }
  </style>
</head>

<body>
  <app-root></app-root>

  <div class="app-boot" aria-hidden="true">
    <span class="app-boot__spin"></span>
  </div>
</body>

</html>
